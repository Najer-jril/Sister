version: "3.9"

services:
  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    image: uas-aggregator:latest
    container_name: uas-aggregator
    depends_on:
      storage:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://user:pass@storage:5432/aggregatordb"
      REDIS_URL: "redis://broker:6379"
      NUM_WORKERS: "4"
      LOG_LEVEL: "INFO"
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  publisher:
    build:
      context: ./publisher
      dockerfile: Dockerfile
    image: uas-publisher:latest
    container_name: uas-publisher
    depends_on:
      aggregator:
        condition: service_healthy
    environment:
      TARGET_URL: "http://aggregator:8080/publish"
      TOTAL_EVENTS: "20000"
      DUPLICATE_RATE: "0.30"
      CONCURRENCY: "10"
    networks:
      - internal
    restart: "no"

  broker:
    image: redis:7-alpine
    container_name: uas-broker
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - broker_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  storage:
    image: postgres:16-alpine
    container_name: uas-storage
    environment:
      POSTGRES_DB: aggregatordb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aggregatordb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
    name: uas_pg_data
  broker_data:
    name: uas_broker_data

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
